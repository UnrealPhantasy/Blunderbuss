# Cargo workspace.
#
# Why several crates rather than one: the step-2 Python binding will require
# `crate-type = ["cdylib"]`, which is incompatible with a normal Rust library
# consumed by a binary. The standard workaround is to keep the logic in a pure
# crate (`engine`) and have only thin wrappers around it: the UCI binary, then
# the Python module.
#
#   engine/    the logic — search, evaluation, Position interface
#   uci/       (to come) the binary that speaks the UCI protocol
#   bindings/  (to come, step 2) the PyO3 wrapper

[workspace]
resolver = "3"
members = ["engine", "uci"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

# Build profile for performance measurements: without it, a debug-mode benchmark
# gives numbers 20 to 50 times too slow, hence useless.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
